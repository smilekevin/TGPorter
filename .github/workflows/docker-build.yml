name: Build Telegram Media Downloader Docker

on:
  push:
    branches: [master]

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: telegram-media-downloader-docker-build
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilekevin/hermes-telegram-downloader

jobs:
  build:
    if: github.event.deleted != true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get source commit
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SHA"

      - name: Select image tags
        id: tags
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
          RELEASE_PUBLISHED: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$VERSION_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Git tag must be a valid Docker tag (1-128 letters, digits, underscores, dots or hyphens; cannot start with a dot or hyphen)."
              exit 1
            fi
            if [[ "$VERSION_TAG" == "latest" || "$VERSION_TAG" == sha-* ]]; then
              echo "::error::The latest and sha-* image tags are reserved for releases and source commits."
              exit 1
            fi
          fi
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${SHA}"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "${IMAGE}:${VERSION_TAG}"
            fi
            if [[ "$RELEASE_PUBLISHED" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        id: check
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          # Master pushes and releases always build; cached PR builds may skip.
          if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == refs/tags/* || "$FORCE" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect \
            "${IMAGE}:sha-${SHA}" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image already exists. Skipping build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Telegram Media Downloader
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=MangoIsIllegal, smilekevin
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show immutable image reference
        if: steps.check.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo '### Image for verification'
            echo "Source commit: ${SHA}"
            echo
            echo 'Published image tags:'
            while IFS= read -r tag; do
              echo "- \`${tag}\`"
            done <<< "$TAGS"
            echo
            echo "\`docker pull ${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
