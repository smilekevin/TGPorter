name: Build Release Docker Image

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: telegram-media-downloader-release
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilekevin/telegram-media-downloader

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get source commit
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SHA"

      - name: Select release image tags
        id: tags
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo '::error::Release builds require a tag ref.'
            exit 1
          fi
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git tag must be a valid Docker tag (1-128 letters, digits, underscores, dots or hyphens; cannot start with a dot or hyphen).'
            exit 1
          fi
          if [[ "$VERSION_TAG" == "latest" || "$VERSION_TAG" == sha-* ]]; then
            echo '::error::The latest and sha-* image tags are reserved for releases and source commits.'
            exit 1
          fi
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${SHA}"
            echo "${IMAGE}:${VERSION_TAG}"
            echo "${IMAGE}:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Telegram Media Downloader
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=MangoIsIllegal, smilekevin
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show release image reference
        id: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Published image digest is missing or invalid.'
            exit 1
          fi
          {
            echo '## Release Docker image'
            echo "Source commit: ${SHA}"
            echo
            echo 'Package: [telegram-media-downloader](https://github.com/users/smilekevin/packages/container/telegram-media-downloader)'
            echo
            echo 'Published image tags:'
            while IFS= read -r tag; do
              echo "- \`${tag}\`"
            done <<< "$TAGS"
            echo
            echo 'Pull this exact image:'
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo 'Compose image:'
            echo '```yaml'
            echo "image: ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Release notes with Docker image
        id: release_notes
        uses: actions/github-script@v8
        env:
          VERSION_TAG: ${{ steps.tags.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          retries: 3
          script: |
            const { IMAGE: image, VERSION_TAG: version, DIGEST: digest } = process.env;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) {
              throw new Error('Published image digest is missing or invalid.');
            }
            const release_id = context.payload.release.id;
            // Read the current notes to retain edits made while the image built.
            const { data: release } = await github.rest.repos.getRelease({
              ...context.repo, release_id,
            });
            if (release.tag_name !== version) {
              throw new Error('Release tag changed after the image build.');
            }
            const startMarker = '<!-- release-docker-image:start -->';
            const endMarker = '<!-- release-docker-image:end -->';
            const section = [
              startMarker,
              '## Docker image',
              '',
              'Supported platforms: `linux/amd64`, `linux/arm64`.',
              '',
              '```bash',
              `docker pull ${image}:${version}`,
              '```',
              '',
              'Pull this exact image by digest:',
              '',
              '```bash',
              `docker pull ${image}@${digest}`,
              '```',
              endMarker,
            ].join('\n');
            const body = release.body || '';
            const start = body.indexOf(startMarker);
            const end = body.indexOf(endMarker);
            let updatedBody;
            if (start === -1 && end === -1) {
              updatedBody = body + (body ? '\n\n' : '') + section;
            } else {
              if (start === -1 || end < start) {
                throw new Error('Docker image section markers are incomplete.');
              }
              updatedBody = body.slice(0, start) + section + body.slice(end + endMarker.length);
            }
            if (updatedBody !== body) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, body: updatedBody,
              });
            }
