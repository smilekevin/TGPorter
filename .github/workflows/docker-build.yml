name: Build Hermes Docker

on:
  push:
    branches: [master]

  schedule:
    # Every 6 hours (UTC)
    - cron: '17 */6 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-docker-build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilekevin/hermes-telegram-downloader

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get source commit
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SHA"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        id: check
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect \
            "${IMAGE}:sha-${SHA}" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Image already exists. Skipping build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=MangoIsIllegal, smilekevin
          cache-from: type=gha
          cache-to: type=gha,mode=max
