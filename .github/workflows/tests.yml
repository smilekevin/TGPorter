name: Telegram Media Downloader CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-media-downloader-ci-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilekevin/telegram-media-downloader

jobs:
  tests:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide whether this run can publish
        id: publication
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_ACTOR" == "dependabot[bot]" || ("$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY") ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Get source commit
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SHA"

      - name: Select verification image tag
        id: tags
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine verification images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publication.outputs.publish == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Telegram Media Downloader
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=MangoIsIllegal, smilekevin
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show CI image for verification
        id: summary
        env:
          PUBLISHED: ${{ steps.publication.outputs.publish }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.version.outputs.sha }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          if [[ "$PUBLISHED" == "true" && ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Published image digest is missing or invalid.'
            exit 1
          fi
          {
            echo '## CI image for verification'
            echo "Source commit: ${SHA}"
            echo
            if [[ "$PUBLISHED" == "true" ]]; then
              echo 'Package: [telegram-media-downloader](https://github.com/users/smilekevin/packages/container/telegram-media-downloader)'
              echo
              echo 'Published image tags:'
              while IFS= read -r tag; do
                echo "- \`${tag}\`"
              done <<< "$TAGS"
              echo
              echo 'Pull this exact image:'
              echo '```bash'
              echo "docker pull ${IMAGE}@${DIGEST}"
              echo '```'
              echo
              echo 'Compose image:'
              echo '```yaml'
              echo "image: ${IMAGE}@${DIGEST}"
              echo '```'
              echo
              echo 'CI images do not update latest.'
            else
              echo 'Image not published: fork and Dependabot PRs have a read-only token.'
              echo 'This run validates the build; no pullable image was published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
