name: TG Porter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgporter-ci-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilekevin/tgporter

jobs:
  tests:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this run can publish
        id: publication
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_ACTOR" == "dependabot[bot]" || ("$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY") ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Get source commit and application version
        id: version
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [[ -n "$BASE_VERSION" ]]; then
            APP_VERSION="${BASE_VERSION}+${SHORT_SHA}"
          else
            APP_VERSION="sha-${SHORT_SHA}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Source SHA: $SHA"
          echo "Application version: $APP_VERSION"

      - name: Select verification image tag
        id: tags
        shell: bash
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${SHA}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.publication.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine verification images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.publication.outputs.publish == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=TG Porter
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=MangoIsIllegal, smilekevin
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show CI image for verification
        id: summary
        env:
          PUBLISHED: ${{ steps.publication.outputs.publish }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.version.outputs.sha }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          if [[ "$PUBLISHED" == "true" && ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Published image digest is missing or invalid.'
            exit 1
          fi
          {
            echo '## CI image for verification'
            echo "Source commit: ${SHA}"
            echo "Application version: ${APP_VERSION}"
            echo
            if [[ "$PUBLISHED" == "true" ]]; then
              echo 'Package: [tgporter](https://github.com/users/smilekevin/packages/container/tgporter)'
              echo
              echo 'Published image tags:'
              while IFS= read -r tag; do
                echo "- \`${tag}\`"
              done <<< "$TAGS"
              echo
              echo 'Pull this exact image:'
              echo '```bash'
              echo "docker pull ${IMAGE}@${DIGEST}"
              echo '```'
              echo
              echo 'Compose image:'
              echo '```yaml'
              echo "image: ${IMAGE}@${DIGEST}"
              echo '```'
              echo
              echo 'CI images do not update latest.'
            else
              echo 'Image not published: fork and Dependabot PRs have a read-only token.'
              echo 'This run validates the build; no pullable image was published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v6
        if: steps.publication.outputs.publish == 'true'
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies for skill packaging
        id: skill_dependencies
        if: steps.publication.outputs.publish == 'true'
        run: python -m pip install -r requirements.txt

      - name: Build CI preview skill
        id: skill
        if: steps.publication.outputs.publish == 'true'
        env:
          SHA: ${{ steps.version.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/build_skill.py --tag "sha-${SHA}" --commit "$SHA" \
            --repository "$GITHUB_REPOSITORY" --image "$IMAGE" --digest "$DIGEST" \
            --ci-run-url "$CI_RUN_URL" --output-dir dist

      - name: Upload CI preview skill
        id: skill_upload
        if: steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/TGPorterSkills.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Show CI preview skill download
        id: skill_summary
        if: steps.publication.outputs.publish == 'true'
        env:
          ARTIFACT_URL: ${{ steps.skill_upload.outputs.artifact-url }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo '## Agent skill CI preview'
            echo "[Download TGPorterSkills.zip](${ARTIFACT_URL})"
            echo
            echo "Source and image version: sha-${SHA}"
            echo 'This preview is for verification, requires GitHub login and is retained for 14 days.'
          } >> "$GITHUB_STEP_SUMMARY"
