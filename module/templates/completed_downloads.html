<template x-for="task in completedTasks" :key="task.task_id">
    {% call task_card('border-gray-100') %}
        <div class="flex items-start gap-3">
            <!-- Checkbox -->
            <input type="checkbox" class="w-4 h-4 mt-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500 shrink-0"
                :value="task.task_id"
                :checked="selectedTasks.includes(task.task_id)"
                @change="toggleSelect(task.task_id)">

            <!-- File Info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700">
                        <span data-i18n="Completed" x-text="t('Completed')">Completed</span>
                    </span>
                    <span x-show="task.completion_reason" class="text-xs text-gray-500" x-text="t(task.completion_reason || '')"></span>
                    <span class="text-xs text-gray-400 font-medium" x-text="task.chat_title || task.chat"></span>
                    <span class="text-xs text-gray-300">|</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="'task: ' + (task.task_id_display || task.task_id)"></span>
                </div>
                <h4 class="text-sm font-medium text-gray-900 sm:truncate line-clamp-2" :title="task.filename" x-text="task.filename"></h4>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1.5 text-xs text-gray-500">
                    <span x-text="t(task.total_size)"></span>
                    <template x-if="task.completed_time">
                        <span>
                            <span class="text-gray-300">|</span>
                            <span class="text-gray-400" x-text="t('Completed ') + task.completed_time"></span>
                        </span>
                    </template>
                </div>
                <div class="mt-1.5 text-xs text-gray-400 truncate" :title="task.save_path">
                    <svg class="w-3 h-3 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                    </svg>
                    <span x-text="task.save_path"></span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button
                    @click="deleteTask(task.task_id)"
                    class="btn-action p-2.5 sm:p-1.5 rounded-lg text-red-500 hover:bg-red-50 border border-red-200"
                    :title="t(&quot;Delete&quot;)"
                >
                    <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Progress Bar (100% green) -->
        <div class="mt-3 ml-7">
            <div class="flex items-center justify-between text-xs text-gray-500 mb-1">
                <span><span data-i18n="Progress" x-text="t('Progress')">Progress</span></span>
                <span class="font-mono font-medium text-green-600" x-text="task.download_progress + '%'"></span>
            </div>
            <div class="w-full h-3 sm:h-2 bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full bg-green-500 progress-bar" style="width: 100%"></div>
            </div>
        </div>
    {% endcall %}
</template>
