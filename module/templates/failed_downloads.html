<template x-for="task in filteredFailedTasks" :key="task.task_id">
    {% call task_card('border-red-100') %}
        <div class="flex items-start gap-3">
            <!-- Checkbox -->
            <input type="checkbox" class="w-4 h-4 mt-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500 shrink-0"
                :value="task.task_id"
                :checked="selectedTasks.includes(task.task_id)"
                @change="toggleSelect(task.task_id)">

            <!-- File Info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700">
                        <span data-i18n="Failed" x-text="t('Failed')">Failed</span>
                    </span>
                    <span class="text-xs text-gray-400 font-medium" x-text="task.chat_title || task.chat"></span>
                    <span class="text-xs text-gray-300">•</span>
                    <span class="text-xs text-gray-400 font-mono" x-text="'task: ' + (task.task_id_display || task.task_id)"></span>
                </div>
                <h4 class="text-sm font-medium text-gray-900 line-clamp-2" :title="task.filename" x-text="task.filename"></h4>
                <div class="flex items-center gap-3 mt-1.5 text-xs text-gray-500">
                    <span x-text="t(task.total_size)"></span>
                    <template x-if="task.failed_time">
                        <span>
                            <span class="text-gray-300">|</span>
                            <span class="text-gray-400" x-text="t('Failed ') + task.failed_time"></span>
                        </span>
                    </template>
                </div>
                <!-- Error Message -->
                <div class="mt-2 flex items-start gap-1.5 p-2 bg-red-50 rounded-lg border border-red-100">
                    <svg class="w-3.5 h-3.5 text-red-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-xs text-red-600" x-text="t(task.error_message)"></span>
                </div>
                <!-- Source Link -->
                <template x-if="task.source_link">
                    <div class="mt-2 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                        <a :href="task.source_link" target="_blank" class="text-xs text-blue-500 hover:text-blue-700 hover:underline truncate" x-text="task.source_link"></a>
                    </div>
                </template>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button
                    @click="retryTask(task.task_id)"
                    class="btn-action p-2.5 sm:p-1.5 rounded-lg text-blue-600 hover:bg-blue-50 border border-blue-200"
                    :title="t(&quot;Retry&quot;)"
                    :aria-label="t('Retry')"
                >
                    <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
                <button
                    @click="deleteTask(task.task_id)"
                    class="btn-action p-2.5 sm:p-1.5 rounded-lg text-red-500 hover:bg-red-50 border border-red-200"
                    :title="t(&quot;Delete&quot;)"
                >
                    <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>
        </div>
    {% endcall %}
</template>
