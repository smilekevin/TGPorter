<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>登录 - Telegram Downloader</title>
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" type="image/png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f9fafb; color: #111827; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        main { width: 100%; max-width: 400px; padding: 32px; background: white; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 24px rgb(0 0 0 / 5%); }
        .logo { width: 44px; height: 44px; padding: 10px; border-radius: 12px; color: white; background: linear-gradient(135deg, #3b82f6, #4f46e5); }
        h1 { margin: 20px 0 8px; font-size: 22px; }
        p { margin: 0 0 24px; color: #6b7280; font-size: 14px; line-height: 1.6; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        input, button { width: 100%; min-height: 46px; border-radius: 8px; font: inherit; }
        input { padding: 10px 12px; border: 1px solid #d1d5db; }
        input:focus { outline: 2px solid #93c5fd; outline-offset: 2px; border-color: #2563eb; }
        button { margin-top: 20px; border: 0; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
        .error { margin: 12px 0 0; color: #b91c1c; }
        @media (max-width: 420px) { main { padding: 24px; } }
    </style>
</head>
<body>
    <main>
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <h1>登录控制面板</h1>
        <p>Telegram Downloader</p>
        <form action="{{ url_for('login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">访问密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
            {% if error %}<p id="login-error" class="error" role="alert">{{ error }}</p>{% endif %}
            <button type="submit">登录</button>
        </form>
    </main>
</body>
</html>
