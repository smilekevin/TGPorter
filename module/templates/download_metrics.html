<div class="download-metrics">
    <svg width="14" height="14" class="text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
    </svg>
    <span class="font-mono font-medium" x-text="downloadSpeed">0.00 B/s</span>
    <span x-text="t('Active streams: {count}', {count: activeStreams})"></span>
</div>
