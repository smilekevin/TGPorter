services:
  telegam-media-downloader:
    image: ghcr.io/smilekevin/telegram-media-downloader:latest
    container_name: telegam-media-downloader
    network_mode: bridge
    stdin_open: true
    tty: true
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - http_proxy=socks5://172.17.0.1:1080
      - https_proxy=socks5://172.17.0.1:1080
    volumes:
      # Download directory (change to your actual path)
      - "./downloads:/app/downloads/"
      # Configuration files
      - "./config.yaml:/app/config.yaml"
      - "./data.yaml:/app/data.yaml"
      # Logs
      - "./log:/app/log/"
      # Telegram session
      - "./sessions:/app/sessions"
      # Temporary files
      - "./temp:/app/temp"
    restart: unless-stopped
