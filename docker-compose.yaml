services:
  tgporter:
    image: ghcr.io/smilekevin/tgporter:latest
    container_name: tgporter
    network_mode: bridge
    stdin_open: true
    tty: true
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - http_proxy=socks5://172.17.0.1:1080
      - https_proxy=socks5://172.17.0.1:1080
    volumes:
      # Download directory (change to your actual path)
      - "./downloads:/app/downloads/"
      # Read-only startup configuration
      - "./config.yaml:/app/config.yaml:ro"
      # Runtime JSON, logs, task history and Telegram sessions
      - "./data:/app/data"
    restart: unless-stopped
