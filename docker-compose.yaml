services:
  tgporter:
    image: ghcr.io/smilekevin/tgporter:latest
    container_name: tgporter
    network_mode: bridge
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # Replace /path/to/downloads with your absolute host download directory.
      - "/path/to/downloads:/app/downloads/"
      # Replace /path/to/tgporter/data with your absolute host configuration/data directory.
      - "/path/to/tgporter/data:/app/data"
      # Optional first-start import only; web Configuration is preferred.
      # - "/path/to/config.yaml:/app/config.yaml:ro"
    restart: unless-stopped
